# GoReleaser config — cross-compiles ctk and publishes a Homebrew formula.
# Release flow:  git tag v0.1.0 && git push --tags && goreleaser release --clean
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ctk
    main: .
    binary: ctk
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - id: ctk
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Publishes a Homebrew CASK to github.com/AbhayShalghar/homebrew-tap (under Casks/)
# so macOS users can: brew install AbhayShalghar/tap/ctk
# Casks are macOS-only; Linux users grab ctk_linux_*.tar.gz from the release.
# The postflight step strips the Gatekeeper quarantine so the unsigned binary runs.
homebrew_casks:
  - name: ctk
    binaries:
      - ctk
    repository:
      owner: AbhayShalghar
      name: homebrew-tap
      branch: main
    homepage: "https://github.com/AbhayShalghar/ctk"
    description: "Context Token Killer — compresses Claude Code tool output (MCP, native tools, Bash)"
    # Declarative `postflight_steps` (the `postflight do` block that `hooks.post`
    # generates is deprecated in Homebrew). Strips the Gatekeeper quarantine so the
    # unsigned binary runs; steps default to the cask's staged path.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "ctk"], chdir: "."
        end
      end

release:
  draft: false
